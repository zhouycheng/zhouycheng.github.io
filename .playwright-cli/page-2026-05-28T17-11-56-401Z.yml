        - paragraph [ref=e8]:
          - text: Date ·
          - time [ref=e9]: 2026-05-27
      - paragraph [ref=e10]: 不知道从什么时候开始，我感觉已经无法脱离CodeX这类Agent工具了。我从23年开始接触编程，最开始参加了Unity虚拟现实的比赛，后来自学了Web网页开发，通过更大的比赛接触到Flutter这个框架，接触到移动应用开发。刚接触移动应用的时候AI还只是对话式的，一些问题仍然需要去搜一些帖子来找解决方案，东拼西凑的开发出的第一个Demo，它在手机上打开的一瞬间，我的成就感要爆炸了。虽然我的本科专业是数字媒体技术，但这两年我不断的在扩展移动应用方向的技术栈。直到今年年初，AI的进化速度给了还没有入行的我大大的冲击，基本上一打开抖音5条有3条都是AI要代替程序员的视频，我的焦虑和第一次在手机上运行Demo一样，也要爆炸了。
      - paragraph [ref=e11]:
        - text: 在这周我看了关注了很久的一个B站博主
        - strong [ref=e12]: polebug23
        - text: 的文章，她在文章中拆解了vibe coding为什么存在成瘾性，在成瘾后怎么做才能缓解自身的焦虑，也正是因为她的这篇文章，推动了我要创建一个属于自己博客的想法。起初我的记录是在语雀，我写了Flutter框架的很多技术文章，CodeX进入我的开发流程后，语雀甚至出现在了我电脑清理软件中的“不常用软件”中，我非常感慨，回想起来好像近几个月我的学习节奏生活节奏全被vibe coding打乱了（这么说好像有点推卸责任的感觉），但事实是，我现在清楚的意识到我需要尽快的找回自己的生活节奏、开发节奏、学习节奏。
      - paragraph [ref=e13]: 我把博客分成了Articles和Log，我期待在不断的记录中能解除我当下的困境，能记录到代码以外、项目以外的感受。
